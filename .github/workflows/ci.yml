name: CI - Notebook Integrity Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbformat

      - name: Validate notebook structure
        run: |
          python - <<'PY'
          import glob
          import sys
          import nbformat

          notebooks = sorted(
              glob.glob("notebooks/**/*.ipynb", recursive=True)
          )

          if not notebooks:
              print("No notebooks found.")
              sys.exit(1)

          errors = []

          for path in notebooks:
              try:
                  notebook = nbformat.read(path, as_version=4)
                  nbformat.validate(notebook)
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"Validated {len(notebooks)} notebooks.")

          PY

      - name: Check for leftover group identifiers
        run: |
          python - <<'PY'
          import glob
          import re
          import sys

          patterns = [
              r'IT251\d{5}',
              r'Member [1-6]\b',
              r'B11G1',
              r'group_pipeline',
              r'group_model_comparison',
          ]

          paths = set()

          for pattern in ("**/*.ipynb", "**/*.md", "**/*.csv", "**/*.txt"):
              paths.update(glob.glob(pattern, recursive=True))

          hits = []

          for path in sorted(paths):
              try:
                  with open(path, encoding="utf-8") as file:
                      content = file.read()
              except (OSError, UnicodeDecodeError):
                  continue

              for pattern in patterns:
                  if re.search(pattern, content):
                      hits.append(f"{path}: matched {pattern!r}")

          if hits:
              print("Leftover identifiers found:")
              print("\n".join(hits))
              sys.exit(1)

          print("Clean - no group/member identifiers found.")

          PY

      - name: Verify model comparison CSV
        run: |
          python - <<'PY'
          import csv
          import os
          import sys

          path = "results/metrics/model_comparison.csv"

          if not os.path.isfile(path):
              print(f"Missing required file: {path}")
              sys.exit(1)

          with open(path, newline="", encoding="utf-8-sig") as file:
              rows = list(csv.DictReader(file))

          if len(rows) != 6:
              print(f"Expected 6 model rows, found {len(rows)}")
              sys.exit(1)

          print(f"CSV check passed - {len(rows)} models present.")

          PY
